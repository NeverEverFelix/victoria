services:
  victoria-postgres:
    image: pgvector/pgvector:pg15
    container_name: victoria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: victoria_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - victoria_pgvector_data:/var/lib/postgresql/data
      - ./db/local/init.sql:/docker-entrypoint-initdb.d/00-victoria-local-init.sql:ro

volumes:
  victoria_pgvector_data:
