services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: victoria_local
      POSTGRES_USER: victoria
      POSTGRES_PASSWORD: ${VICTORIA_LOCAL_DB_PASSWORD:-victoria_local_dev_only}
    ports:
      - "127.0.0.1:${VICTORIA_LOCAL_DB_PORT:-54329}:5432"
    volumes:
      - victoria_postgres_data:/var/lib/postgresql/data
      - ./db/local/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victoria -d victoria_local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  victoria_postgres_data:
