<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title description">
  <title id="title">Victoria orchestrated multi-agent architecture</title>
  <desc id="description">A central Victoria Orchestrator coordinates a Financial Moment Agent and Savings Reasoning Agent. Proposed decisions cross a deterministic validation and financial policy boundary before tools can append financial history. Verified outcomes pass to the Companion Voice Agent for the final user response.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526078"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23845B"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A56512"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #59657A; }
      .section { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .nodeTitle { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; text-anchor: middle; }
      .nodeCopy { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #59657A; text-anchor: middle; }
      .edge { fill: none; stroke: #526078; stroke-width: 2.4; marker-end: url(#arrow); }
      .edgeGreen { fill: none; stroke: #23845B; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .edgeAmber { fill: none; stroke: #A56512; stroke-width: 2.4; marker-end: url(#arrowAmber); }
      .edgeDashed { fill: none; stroke: #526078; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .edgeLabel { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #526078; text-anchor: middle; }
      .edgeLabelAmber { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #935A10; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="#F8FAFD"/>
  <text x="70" y="66" class="title">Victoria Multi-Agent Architecture</text>
  <text x="70" y="96" class="subtitle">Specialist reasoning coordinated by one orchestrator; deterministic code retains financial authority.</text>

  <rect x="50" y="135" width="470" height="780" rx="24" fill="#EDF5FF" stroke="#B6D5F4" stroke-width="2"/>
  <text x="78" y="170" class="section" fill="#2E6FA8">CONVERSATION AND CONTEXT</text>

  <rect x="545" y="135" width="525" height="780" rx="24" fill="#EDF8F1" stroke="#B5DFC5" stroke-width="2"/>
  <text x="573" y="170" class="section" fill="#26734F">VICTORIA AGENT TEAM</text>

  <rect x="1095" y="135" width="655" height="780" rx="24" fill="#FFF7E8" stroke="#E8C98F" stroke-width="2"/>
  <text x="1123" y="170" class="section" fill="#955D12">DETERMINISTIC FINANCIAL AUTHORITY</text>

  <g filter="url(#shadow)">
    <rect x="90" y="215" width="150" height="86" rx="43" fill="#FFFFFF" stroke="#68A7DF" stroke-width="2.5"/>
    <text x="165" y="251" class="nodeTitle">User</text>
    <text x="165" y="275" class="nodeCopy">Message</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="215" width="190" height="86" rx="16" fill="#FFFFFF" stroke="#68A7DF" stroke-width="2.5"/>
    <text x="385" y="251" class="nodeTitle">Conversation Entry</text>
    <text x="385" y="275" class="nodeCopy">Turn boundary</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="185" y="395" width="220" height="96" rx="16" fill="#FFFFFF" stroke="#7D78C8" stroke-width="2.5"/>
    <text x="295" y="433" class="nodeTitle">Context Assembler</text>
    <text x="295" y="458" class="nodeCopy">Relevant, scoped context</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M 95 665 C 95 638, 245 638, 245 665 L 245 735 C 245 762, 95 762, 95 735 Z" fill="#FFFFFF" stroke="#7D78C8" stroke-width="2.5"/>
    <ellipse cx="170" cy="665" rx="75" ry="18" fill="#F5F1FF" stroke="#7D78C8" stroke-width="2.5"/>
    <text x="170" y="702" class="nodeTitle">User Memory</text>
    <text x="170" y="727" class="nodeCopy">Evolves over time</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M 310 665 C 310 638, 470 638, 470 665 L 470 735 C 470 762, 310 762, 310 735 Z" fill="#FFFFFF" stroke="#7D78C8" stroke-width="2.5"/>
    <ellipse cx="390" cy="665" rx="80" ry="18" fill="#F5F1FF" stroke="#7D78C8" stroke-width="2.5"/>
    <text x="390" y="697" class="nodeTitle">Financial History</text>
    <text x="390" y="722" class="nodeCopy">Append-only records</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="215" width="260" height="105" rx="18" fill="#FFFFFF" stroke="#41A576" stroke-width="3"/>
    <text x="750" y="257" class="nodeTitle">Victoria Orchestrator</text>
    <text x="750" y="283" class="nodeCopy">Routes, reconciles, proposes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="435" width="290" height="92" rx="16" fill="#FFFFFF" stroke="#66B88C" stroke-width="2.5"/>
    <text x="750" y="472" class="nodeTitle">Financial Moment Agent</text>
    <text x="750" y="497" class="nodeCopy">Intent, facts, ambiguity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="600" width="290" height="92" rx="16" fill="#FFFFFF" stroke="#66B88C" stroke-width="2.5"/>
    <text x="750" y="637" class="nodeTitle">Savings Reasoning Agent</text>
    <text x="750" y="662" class="nodeCopy">Evidence and recommendation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="775" width="290" height="100" rx="50" fill="#E5F7ED" stroke="#23845B" stroke-width="3"/>
    <text x="750" y="816" class="nodeTitle">Companion Voice Agent</text>
    <text x="750" y="841" class="nodeCopy">Victoria's final user-facing voice</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="215" width="245" height="96" rx="16" fill="#FFFFFF" stroke="#D69A3B" stroke-width="2.5"/>
    <text x="1272" y="253" class="nodeTitle">Decision Validator</text>
    <text x="1272" y="278" class="nodeCopy">Typed schema and invariants</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M 1510 207 L 1630 263 L 1510 319 L 1390 263 Z" fill="#FFF0D1" stroke="#C9821F" stroke-width="3"/>
    <text x="1510" y="253" class="nodeTitle">Financial mutation</text>
    <text x="1510" y="276" class="nodeTitle">allowed?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1385" y="435" width="250" height="96" rx="16" fill="#FFFFFF" stroke="#D69A3B" stroke-width="2.5"/>
    <text x="1510" y="473" class="nodeTitle">Approved Tool Gateway</text>
    <text x="1510" y="498" class="nodeCopy">Exact approved action only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="620" width="245" height="96" rx="16" fill="#FFFFFF" stroke="#D69A3B" stroke-width="2.5"/>
    <text x="1272" y="658" class="nodeTitle">Verified Outcome</text>
    <text x="1272" y="683" class="nodeCopy">Locked facts and response goal</text>
  </g>

  <path class="edge" d="M 240 258 L 290 258"/>
  <path class="edge" d="M 385 301 L 385 350 L 295 350 L 295 395"/>
  <path class="edge" d="M 170 647 L 170 560 L 255 560 L 255 491"/>
  <path class="edge" d="M 390 647 L 390 560 L 335 560 L 335 491"/>
  <path class="edgeGreen" d="M 405 443 L 520 443 L 520 267 L 620 267"/>
  <text x="520" y="427" class="edgeLabel">Relevant context</text>

  <path class="edgeGreen" d="M 700 320 L 700 435"/>
  <text x="658" y="380" class="edgeLabel">Interpret</text>
  <path class="edgeGreen" d="M 800 435 L 800 355 L 820 355 L 820 320"/>
  <text x="862" y="376" class="edgeLabel">Finding</text>

  <path class="edgeGreen" d="M 660 320 L 660 600"/>
  <text x="618" y="562" class="edgeLabel">Evaluate</text>
  <path class="edgeGreen" d="M 840 600 L 840 350 L 850 350 L 850 320"/>
  <text x="920" y="558" class="edgeLabel">Recommendation</text>

  <path class="edgeAmber" d="M 880 267 L 1150 263"/>
  <text x="1015" y="249" class="edgeLabelAmber">Proposed decision</text>
  <path class="edgeAmber" d="M 1395 263 L 1390 263"/>

  <path class="edgeAmber" d="M 1510 319 L 1510 435"/>
  <text x="1545" y="380" class="edgeLabelAmber">Allowed</text>

  <path class="edgeAmber" d="M 1385 483 L 1280 483 L 1280 620"/>
  <text x="1334" y="466" class="edgeLabelAmber">Trusted result</text>

  <path class="edgeDashed" d="M 1150 285 L 1080 285 L 1080 668 L 1150 668"/>
  <text x="1060" y="481" class="edgeLabel" transform="rotate(-90 1060 481)">Read-only response</text>

  <path class="edgeDashed" d="M 1630 263 L 1690 263 L 1690 668 L 1395 668"/>
  <text x="1710" y="470" class="edgeLabel" transform="rotate(90 1710 470)">Refuse or clarify</text>

  <path class="edgeAmber" d="M 1510 531 L 1510 760 L 1420 760 L 1420 668 L 1395 668"/>

  <path class="edge" d="M 1150 668 L 970 668 L 970 825 L 895 825"/>
  <text x="1015" y="803" class="edgeLabel">Locked facts</text>

  <path class="edgeGreen" d="M 605 825 L 530 825 L 530 950 L 165 950 L 165 301"/>
  <text x="352" y="972" class="edgeLabel">One coherent Victoria response</text>

  <path class="edgeAmber" d="M 1385 515 L 1345 565 L 1000 565 L 1000 885 L 390 885 L 390 762"/>
  <text x="1185" y="550" class="edgeLabelAmber">Append immutable records</text>

  <rect x="70" y="950" width="18" height="18" rx="4" fill="#EDF5FF" stroke="#68A7DF"/>
  <text x="100" y="965" class="subtitle">Conversation and context</text>
  <rect x="340" y="950" width="18" height="18" rx="4" fill="#EDF8F1" stroke="#41A576"/>
  <text x="370" y="965" class="subtitle">Agent reasoning</text>
  <rect x="555" y="950" width="18" height="18" rx="4" fill="#FFF7E8" stroke="#D69A3B"/>
  <text x="585" y="965" class="subtitle">Deterministic authority</text>
  <text x="70" y="1010" class="subtitle">Agents advise. Deterministic policy authorizes. The Companion Voice Agent speaks from verified facts.</text>
</svg>
